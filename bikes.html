<!DOCTYPE html>
<html lang="en">
<head>
    <title>Vishnu Bikes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Available Bikes - Vishnu Showroom</h1>
</header>
<div class="bike-container">
    <div class="bike">
        <img src="images/bike1.jpg">
        <h3>Yamaha R15</h3>
        <p>Price: ₹1.8L</p>
        <button onclick="bookBike('Yamaha R15')">Book Now</button>
    </div>
    <div class="bike">
        <img src="images/bike2.jpg">
        <h3>Royal Enfield Classic 350</h3>
        <p>Price: ₹2.1L</p>
        <button onclick="bookBike('Classic 350')">Book Now</button>
    </div>
    <div class="bike">
        <img src="images/bike3.jpg">
        <h3>KTM Duke 200</h3>
        <p>Price: ₹2.0L</p>
        <button onclick="bookBike('Duke 200')">Book Now</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
